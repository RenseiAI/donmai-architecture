# Closed-source content guard for the donmai-architecture corpus.
#
# Runs guard-b-lint.sh to catch content that must never ship in a public repo:
# the closed product brand, internal tracker issue IDs (in prose, in branch and
# worktree slugs, in title case, and as tracker deep links on any path),
# closed control-plane CLI endpoints, private-repo references, internal domains,
# internal monorepo paths, developer absolute paths, closed-source environment
# variable names, and production measurements of the closed control plane.
#
# Four checks, all blocking:
#   1. self-test  — proves each rule still fires on a known-bad sample, and that
#                   the engine behaviours no file scan can reach still work. A
#                   guard that has never been watched fail is not evidence.
#   2. files      — every tracked file in the working tree.
#   3. commits    — the commit messages this PR adds, merge commits included.
#                   Commit messages are published with the repo and a file scan
#                   cannot see them; a merge commit is the one place a branch
#                   slug lands in published history.
#   4. squash msg — the message GitHub composes from the PR title and body when
#                   the PR is squash-merged. That text becomes a published
#                   commit and exists in no branch commit, so checks 2 and 3
#                   both miss it. This is how a tracker ID reached main before.
#
# The push-to-main run repeats check 3 over whatever actually landed, as a
# backstop for anything that bypassed a pull request.
#
# No `paths:` filter: a leak in a .txt, .json or .go file is still a leak, and
# a filtered trigger reports "green" by not running.
#
# See scripts/guard-b-lint.sh and .guard-allowlist for the rule set and the
# per-line overrides.

name: Closed-source content guard

on:
  pull_request:
    # `edited` matters: the PR title and body ARE the squash-merge message, so a
    # body edit after the last push can introduce a leak no commit contains.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  guard-b:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test — prove every rule and engine path still fires
        run: ./scripts/guard-b-lint-selftest.sh

      - name: Run guard-b-lint (all tracked files)
        run: ./scripts/guard-b-lint.sh --all

      - name: Run guard-b-lint (commit messages added by this PR, merges included)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          ./scripts/guard-b-lint.sh --commits "origin/${{ github.base_ref }}..HEAD"

      - name: Run guard-b-lint (the squash-merge message GitHub will compose)
        if: github.event_name == 'pull_request'
        env:
          # Via env, never inlined into the script body: a PR title or body is
          # attacker-controlled text and must not be interpolated into bash.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | ./scripts/guard-b-lint.sh --stdin pr-squash-message

      - name: Run guard-b-lint (commit messages just pushed to main)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${BEFORE}..HEAD"
          fi
          echo "scanning commit messages in $RANGE"
          ./scripts/guard-b-lint.sh --commits "$RANGE"
