# Closed-source content guard for the donmai-architecture corpus.
#
# Runs guard-b-lint.sh to catch content that must never ship in a public repo:
# the closed product brand, internal tracker issue IDs (in prose, in branch and
# worktree slugs, and as tracker deep links), private-repo references, internal
# domains, internal monorepo paths, developer absolute paths, and closed-source
# environment variable names.
#
# Three checks, all blocking:
#   1. self-test  — proves each rule still fires on a known-bad sample. A guard
#                   that has never been watched fail is not evidence.
#   2. files      — every tracked file in the working tree.
#   3. commits    — the commit messages this PR adds. Commit messages are
#                   published with the repo and a file scan cannot see them.
#
# No `paths:` filter: a leak in a .txt, .json or .go file is still a leak, and
# a filtered trigger reports "green" by not running.
#
# See scripts/guard-b-lint.sh and .guard-allowlist for the rule set and the
# per-line overrides.

name: Closed-source content guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  guard-b:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test — prove every rule still fires
        run: ./scripts/guard-b-lint-selftest.sh

      - name: Run guard-b-lint (all tracked files)
        run: ./scripts/guard-b-lint.sh --all

      - name: Run guard-b-lint (commit messages added by this PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          ./scripts/guard-b-lint.sh --commits "origin/${{ github.base_ref }}..HEAD"
